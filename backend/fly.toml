app = "exetrack-backend"
primary_region = "ams"

[build]

[env]
  APNS_USE_SANDBOX = "true"
  APNS_BUNDLE_ID   = "com.exetrack.app"

[http_service]
  internal_port = 8000
  force_https   = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source      = "exetrack_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
